<div class="qa-popup-panel" id="tab-iot-qa">
    <div class="qa-popup-header">
      <h2><i data-icon="help" data-size="15"></i> ถามคำถามเกี่ยวกับข้อมูลติดตั้ง IoT</h2>
      <button type="button" class="qa-popup-close" onclick="closeQaBubble()">×</button>
    </div>
    <div class="qa-popup-body">
      <div class="qa-presets">
        <button class="qa-chip" onclick="askIotPreset('ภาพรวมทั้งหมด')">ภาพรวมทั้งหมด</button>
        <button class="qa-chip" onclick="askIotPreset('จังหวัดไหนติดตั้งน้อยที่สุด')">จังหวัดไหนติดตั้งน้อยที่สุด</button>
        <button class="qa-chip" onclick="askIotPreset('จังหวัดไหนติดตั้งมากที่สุด')">จังหวัดไหนติดตั้งมากที่สุด</button>
        <button class="qa-chip" onclick="askIotPreset('วางแผนไปติดตั้งให้หน่อย')">วางแผนไปติดตั้ง</button>
      </div>
      <div class="qa-log" id="iotQaLog"></div>
      <div class="qa-input-row">
        <input type="text" id="iotQaInput" placeholder="พิมพ์คำถาม เช่น จังหวัดเลยติดตั้งไปกี่คน" onkeydown="if(event.key==='Enter') askIotQuestion()">
        <button class="btn btn-brand" onclick="askIotQuestion()">ถาม</button>
      </div>
      <p style="font-size:12px; color:var(--muted); margin-top:10px;">
        หมายเหตุ: คำถามทั่วไปตอบจากข้อมูลในระบบโดยตรง (ฟรี ไม่มีค่าใช้จ่าย) ถ้าคำถามซับซ้อนเกินจะลองส่งให้ AI ช่วยตอบต่อโดยอัตโนมัติ — ถ้ายังไม่ได้ตั้งค่า AI ไว้ ระบบจะข้ามส่วนนี้ไปเฉยๆ ไม่ error
      </p>
    </div>
  </div>
